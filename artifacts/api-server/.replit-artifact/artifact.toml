kind = "api"
previewPath = "/" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "Stock Analyst App"
paths = ["/"]

[services.development]
run = "/home/runner/workspace/stock-analyst/.venv/bin/streamlit run /home/runner/workspace/stock-analyst/app.py --server.port 5000"

[services.production]

[services.production.run]
args = [
  "/home/runner/workspace/stock-analyst/.venv/bin/streamlit",
  "run",
  "/home/runner/workspace/stock-analyst/app.py",
  "--server.port", "5000",
  "--server.headless", "true",
  "--server.enableCORS", "false",
  "--server.enableXsrfProtection", "false"
]

[services.production.run.env]
PORT = "5000"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
